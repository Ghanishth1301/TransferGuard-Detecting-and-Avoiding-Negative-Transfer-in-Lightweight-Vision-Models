# CIFAR-100 with MobileNetV3-Small (Moderate/Positive Transfer Regime)
experiment:
  name: "cifar100_mobilenetv3"
  seed: 42
  device: "auto"
  output_dir: "results/cifar100_mobilenetv3"

model:
  backbone: "mobilenet_v3_small"
  pretrained: true
  num_classes: 100
  feature_dim: 576

data:
  dataset: "cifar100"
  data_dir: "./data"
  batch_size: 128
  num_workers: 4
  image_size: 224
  debug_subset: null

training:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  mixed_precision: true

transferguard:
  enabled: true
  freeze_threshold: 0.60
  bypass_threshold: 0.30
  regularization_lambda: 0.005

