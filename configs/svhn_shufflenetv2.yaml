# SVHN with ShuffleNetV2 1.0x (Lightweight Channel-Shuffle Architecture)
experiment:
  name: "svhn_shufflenetv2"
  seed: 42
  device: "auto"
  output_dir: "results/svhn_shufflenetv2"

model:
  backbone: "shufflenet_v2_x1_0"
  pretrained: true
  num_classes: 10
  feature_dim: 1024

data:
  dataset: "svhn"
  data_dir: "./data"
  batch_size: 64
  num_workers: 2
  image_size: 224
  debug_subset: null

training:
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  mixed_precision: false

transferguard:
  enabled: true
  freeze_threshold: 0.70
  bypass_threshold: 0.40
  regularization_lambda: 0.01

