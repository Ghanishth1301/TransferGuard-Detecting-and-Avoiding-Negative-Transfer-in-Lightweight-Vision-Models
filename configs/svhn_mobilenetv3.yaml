# SVHN with MobileNetV3-Small (Severe Negative Transfer Regime)
experiment:
  name: "svhn_mobilenetv3_small"
  seed: 42
  device: "auto"
  output_dir: "results/svhn_mobilenetv3"

model:
  backbone: "mobilenet_v3_small"
  pretrained: true
  num_classes: 10
  feature_dim: 576

data:
  dataset: "svhn"
  data_dir: "./data"
  batch_size: 64
  num_workers: 2
  image_size: 224
  debug_subset: null

training:
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  mixed_precision: false

transferguard:
  enabled: true
  freeze_threshold: 0.70
  bypass_threshold: 0.40
  regularization_lambda: 0.01

